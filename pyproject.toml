[project]
name = "mpsc50yapi"
version = "0.1.0"
description = "Backend for github.com/docufy-technologies/mpsc50years"
readme = "README.md"
requires-python = ">=3.12"
license = "LICENSE"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=45.0.5",
    "fastapi[all]>=0.116.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.11.2",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.0",
    "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # FastAPI's Depends()/Query() in defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
